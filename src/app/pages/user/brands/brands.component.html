<section class="brands">
	<div class="brands__filters">
		<input
			id="brands-search"
			pInputText
			type="text"
			placeholder="Назва, місто або країна"
			class="brands__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>
	</div>

	<div class="brands__results">
		<div class="brands__grid">
			@for (item of results(); track item._id) {
			<div class="brands__row" (click)="view(item)">
				<app-brand-short [entity]="item" />
			</div>
			} @empty {
			<p class="brands__empty">За заданим запитом брендів не знайдено.</p>
			}
		</div>
	</div>
</section>
