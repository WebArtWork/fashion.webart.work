<section class="editor">
	<p-card header="Редактор">
		<div class="editor__picker">
			<p-selectbutton
				[options]="options"
				optionLabel="label"
				optionValue="value"
				[ngModel]="selectedType()"
				(ngModelChange)="selectedType.set($event)"
			/>
		</div>

		@switch (selectedType()) { @case ('item') {
		<app-item-form />
		} @case ('offering') {
		<app-offering-form />
		} @case ('decision') {
		<app-decision-form />
		} @case ('collection') {
		<app-collection-form />
		} @case ('brand') {
		<app-brand-form />
		} @case ('boutique') {
		<app-boutique-form />
		} @case ('stylist') {
		<app-stylist-form />
		} }

		<div class="editor__actions">
			<button pButton type="button" (click)="wValidate()">
				Перевірити
			</button>
		</div>
	</p-card>
</section>
