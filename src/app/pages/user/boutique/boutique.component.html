<section class="boutique">
	@if (entity(); as item) {
	<div class="boutique__actions">
		<button
			pButton
			type="button"
			severity="secondary"
			size="small"
			(click)="share()"
		>
			<i class="pi pi-share-alt"></i>
			{{ translateService.translate('Поділитися')() }}
		</button>
	</div>
	<app-boutique-view [entity]="item" />
	} @else {
	<p-card class="boutique__not-found">
		<p>Агентство не знайдено.</p>
	</p-card>
	}
</section>
