<div class="explore">
	<div class="explore__header">
		<h1 class="explore__title">Пошук</h1>

		<input
			pInputText
			type="text"
			placeholder="Адреса, місто або назва оголошення"
			class="explore__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>

		<p-multiSelect
			appendTo="body"
			scrollHeight="auto"
			[options]="itemTypeOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Тип нерухомості"
			class="explore__filter"
			[ngModel]="selectedItemTypes()"
			(ngModelChange)="selectedItemTypes.set($event)"
		/>

		<p-select
			appendTo="body"
			scrollHeight="auto"
			[options]="offeringTypeOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Тип угоди"
			[showClear]="true"
			class="explore__filter"
			[ngModel]="selectedOfferingType()"
			(ngModelChange)="selectedOfferingType.set($event)"
		/>

		<p-select
			appendTo="body"
			scrollHeight="auto"
			[options]="offeringStatusOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Статус"
			[showClear]="true"
			class="explore__filter"
			[ngModel]="selectedStatus()"
			(ngModelChange)="selectedStatus.set($event)"
		/>

		<a pButton routerLink="/map" severity="secondary" size="small" class="explore__map-link">Карта</a>
	</div>

	<div class="explore__grid">
		@for (row of results(); track row.offering._id) {
		<div class="explore__row" (click)="view(row.offering)">
			<app-offering-short
				[entity]="row.offering"
				[stylist]="row.relations.stylist"
				[boutique]="row.relations.boutique"
				[brand]="row.relations.brand"
				[collection]="row.relations.collection"
				(relationClick)="viewRelation($event)"
			/>
		</div>
		} @empty {
		<p class="explore__empty">За заданими критеріями оголошень не знайдено.</p>
		}
	</div>
</div>
