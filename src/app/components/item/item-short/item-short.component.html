<article class="short">
	<img
		class="short__thumb"
		[src]="photo"
		[alt]="entity.type"
		loading="lazy"
		(error)="onPhotoError($event)"
	/>

	<div class="short__body">
		<h3 class="short__title">{{ entity.type }} · {{ entity.city }}</h3>
		<p class="short__address">{{ entity.address }}</p>

		<div class="short__meta">
			<span>{{ entity.status }}</span>
			<span>{{ entity.characteristics.sizeCategory }}</span>
			@if (entity.characteristics.color) {
				<span>{{ entity.characteristics.color }}</span>
			}
		</div>
	</div>
</article>
