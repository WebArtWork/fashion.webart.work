@if (isMobile()) {
<button
	type="button"
	class="sidebar__backdrop fixed inset-x-0 top-0 bottom-[var(--topbar-h)]"
	[attr.aria-label]="translateService.translate('Menu')()"
	(click)="closeBackdrop($event)"
></button>
}

<aside
	class="sidebar z-[90] flex flex-col overflow-auto bg-[var(--c-bg-secondary)] p-5 shadow"
	[class.sidebar--min]="isMinimized()"
	[style.width.px]="widthPx()"
	[class]="hostPositionClass()"
	(mouseleave)="sidebarService.disableBurgerHover = false; sidebarService.onBurgerHover(false)"
	(mouseenter)="sidebarService.disableBurgerHover = true"
>
	<div
		class="mt-1 flex items-center gap-2 rounded-[var(--radius)] px-2 py-1"
		[class]="isMinimized() ? 'justify-center' : 'justify-between'"
	>
		<a
			(click)="closeIfOverlay()"
			routerLink="/profile"
			class="inline-flex min-w-0 items-center gap-2 text-[var(--c-text-primary)] no-underline"
			[class]="isMinimized() ? 'flex-none justify-center' : 'flex-1'"
		>
			<img
				class="h-8 w-8 rounded-full"
				[src]="userService.thumb()"
				[attr.alt]="translateService.translate('User avatar')()"
				height="32"
				width="32"
			/>
			@if (showNames()) {
			<span class="truncate font-semibold" translate>Profile</span>
			}
		</a>
	</div>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Шер профілю')() : ''"
		[ariaLabel]="translateService.translate('Шер профілю')()"
		(click)="closeIfOverlay()"
		routerLink="/share-profile"
		icon="id-card"
	/>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />

	@if (userService.role('admin')) {
	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Users')() : ''"
		[ariaLabel]="translateService.translate('Users')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/users"
		icon="user-edit"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Clients')() : ''"
		[ariaLabel]="translateService.translate('Clients')()"
		routerLink="/admin/clients"
		(click)="closeIfOverlay()"
		icon="users"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Forms')() : ''"
		[ariaLabel]="translateService.translate('Forms')()"
		(click)="closeIfOverlay()"
		routerLink="/admin/forms"
		icon="table"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Translates')() : ''"
		[ariaLabel]="translateService.translate('Translates')()"
		routerLink="/admin/translates"
		(click)="closeIfOverlay()"
		icon="language"
	/>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />
	}

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Settings')() : ''"
		[ariaLabel]="translateService.translate('Settings')()"
		(click)="closeIfOverlay()"
		routerLink="/settings"
		icon="cog"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Шер Fashion')() : ''"
		[ariaLabel]="translateService.translate('Шер Fashion')()"
		(click)="closeIfOverlay()"
		routerLink="/share"
		icon="qrcode"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Для користувачів')() : ''"
		[ariaLabel]="translateService.translate('Для користувачів')()"
		(click)="closeIfOverlay()"
		routerLink="/for-users"
		icon="user"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Для стилістів')() : ''"
		[ariaLabel]="translateService.translate('Для стилістів')()"
		(click)="closeIfOverlay()"
		routerLink="/for-stylists"
		icon="id-card"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Для брендів')() : ''"
		[ariaLabel]="translateService.translate('Для брендів')()"
		(click)="closeIfOverlay()"
		routerLink="/for-brands"
		icon="building"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Для бутіків')() : ''"
		[ariaLabel]="translateService.translate('Для бутіків')()"
		(click)="closeIfOverlay()"
		routerLink="/for-boutiques"
		icon="briefcase"
	/>

	<app-nav-icon
		[class.sidebar--minimized-icon]="!showNames()"
		[name]="showNames() ? translateService.translate('Feedback')() : ''"
		[ariaLabel]="translateService.translate('Feedback')()"
		(click)="closeIfOverlay()"
		routerLink="/feedback"
		icon="comment"
	/>

	<hr class="my-2 border-0 border-t-2 border-t-[var(--c-text-primary)]" />
</aside>
